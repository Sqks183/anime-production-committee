name: 功能提案
description: 先讨论体验价值和最小范围，再决定是否进入开发。
title: "[提案] "
body:
  - type: markdown
    attributes:
      value: |
        提案不代表已批准开发。优先最小经营闭环，保持既定 React / TypeScript / C++ / WASM 架构，不提前扩展外围系统。
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题
      description: 玩家或团队目前遇到什么具体问题？与动画制作经营体验有什么关系？
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 期望体验与验收示例
      description: 描述具体操作及可观察结果；不以实现某个技术名词作为目标。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 最小实现范围
      description: 明确本次包含和不包含的内容，避免一次引入完整复杂系统。
      value: |
        本次包含：
        本次不包含：
        与已有功能的关系：
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 规则、接口与存档影响
      description: 是否需要新增规则、改 JSON 协议或存档版本？涉及种子时如何保证确定性？尚不明确可写“待讨论”。
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 替代方案与成本
      description: 能否利用现有能力或用更小的实现解决？说明预计工作量、依赖和主要风险。
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 相关任务与待确认事项
      description: 关联已有 Issue，列出需要负责人或接口协作者决定的事项。
