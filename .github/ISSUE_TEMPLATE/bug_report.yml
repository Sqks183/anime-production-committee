name: 缺陷报告
description: 提供可复现的环境、步骤、输入与实际结果。
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有报告。日志、截图和存档必须脱敏；不要提交令牌、真实用户数据或公开安全漏洞的敏感细节。
  - type: textarea
    id: summary
    attributes:
      label: 问题与影响
      description: 描述哪里出错、影响哪些操作，是否阻断开发或验收。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生位置
      options:
        - 页面或交互
        - Zustand 状态或 IndexedDB 存档
        - C++ 规则计算
        - WASM 加载或 JSON 调用
        - 安装、构建或测试
        - Qoder Sites 部署
        - 文档或其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 填写相关版本即可；区分开发服务器、生产预览和已发布站点。
      value: |
        系统与浏览器：
        分支或提交：
        运行方式：
        Node / npm：
        CMake / C++ 编译器 / Emscripten（如相关）：
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 从可重复的初始状态开始，给出操作顺序或完整命令。
      placeholder: |
        1. 使用哪个初始状态或页面
        2. 执行什么命令或操作
        3. 在哪一步出现问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 如有依据，关联已确认的 Issue 或 API / 规则文档。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 提供错误码、状态变化或失败现象；保留关键日志上下文。
    validations:
      required: true
  - type: textarea
    id: deterministic_input
    attributes:
      label: 输入、种子与操作序列
      description: 规则或 WASM 问题请提供脱敏后的初始 JSON、seed、决策顺序及返回 JSON；其他问题可留空。
      placeholder: |
        初始化输入：{"seed":12345}
        操作序列：initialize_game → start_project → advance_day（附每步完整输入和返回状态）
        实际返回：
        相同输入是否稳定复现：
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图与已排查事项
      description: 注明已运行命令及结果；区分真实 WASM、模拟服务测试和浏览器验证。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索相似 Issue，并移除凭据和真实用户数据。
          required: true
