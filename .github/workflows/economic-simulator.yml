name: Economic simulator validation

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/economic-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Run seven-strategy simulation
        run: python scripts/economic_simulator.py --config scripts/simulation_config.example.json
      - name: Upload simulation outputs
        uses: actions/upload-artifact@v4
        with:
          name: economic-simulation-v0.6
          path: |
            summary.json
            trials.csv
