name: v4 contract tests

# 事件内容流水线与 v4 契约测试的门禁：内容校验、生成文件一致性、36 条 JSON 契约用例，
# 以及 v4 契约形状审计（字段/命令/回执/账本/不变式口径，docs/v4-contract-shape.json）。
# 依据 docs/EVENT_CONTENT_PIPELINE.md §3/§4/§7、docs/DATA_DICTIONARY_V4.md §9。

on:
  push:
    paths:
      - "content/events/**"
      - "packages/game-core/**"
      - "scripts/lib/**"
      - "scripts/v4.test.mjs"
      - "scripts/audit-v4-contract.mjs"
      - "docs/v4-contract-shape.json"
      - "docs/DATA_DICTIONARY_V4.md"
      - "docs/M0_CONTRACT_FREEZE.md"
      - "docs/DECISION_LOG.md"
      - "docs/DOMAIN_ARCHITECTURE.md"
      - "docs/EVENT_CONTENT_PIPELINE.md"
      - "docs/blueprints/tv_standard.blueprint.json"
      - "apps/web/src/types/gameV3.ts"
      - "package.json"
      - "scripts/build-event-catalog.mjs"
      - "scripts/build-v4.mjs"
      - "scripts/validate-event-content.mjs"
      - ".github/workflows/v4-contract.yml"
  pull_request:
    paths:
      - "content/events/**"
      - "packages/game-core/**"
      - "scripts/lib/**"
      - "scripts/v4.test.mjs"
      - "scripts/audit-v4-contract.mjs"
      - "docs/v4-contract-shape.json"
      - "docs/DATA_DICTIONARY_V4.md"
      - "docs/M0_CONTRACT_FREEZE.md"
      - "docs/DECISION_LOG.md"
      - "docs/DOMAIN_ARCHITECTURE.md"
      - "docs/EVENT_CONTENT_PIPELINE.md"
      - "docs/blueprints/tv_standard.blueprint.json"
      - "apps/web/src/types/gameV3.ts"
      - "package.json"
      - "scripts/build-event-catalog.mjs"
      - "scripts/build-v4.mjs"
      - "scripts/validate-event-content.mjs"
      - ".github/workflows/v4-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-validation:
    name: 事件内容校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate content/events
        run: node scripts/validate-event-content.mjs
      - name: Regenerate embedded catalog and require it to match the commit
        run: |
          node scripts/build-event-catalog.mjs
          git diff --exit-code packages/game-core/src/v4/event_catalog_generated.cpp

  v4-contract:
    name: v4 契约测试（WASM）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          source "$HOME/emsdk/emsdk_env.sh"
          echo "$PATH" >> "$GITHUB_PATH"
          em++ --version
      - name: Build v4 module and run contract tests
        run: npm run test:v4
      - name: Audit v4 contract shape against the data dictionary
        run: node scripts/audit-v4-contract.mjs
